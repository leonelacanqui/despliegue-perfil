<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto Leonela Rosario</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-slate-950">


<div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6">


<h1 class="text-xl font-bold text-slate-900 dark:text-white">

Formulario de Contacto

</h1>



<form class="mt-6 space-y-4">


<div>

<label class="block text-sm font-medium text-slate-700 dark:text-slate-200">

Nombre

</label>


<input
type="text"
placeholder="Escribe tu nombre"
class="w-full px-4 py-2 border rounded-lg 
dark:bg-slate-700 dark:text-white">

</div>



<div>

<label class="block text-sm font-medium text-slate-700 dark:text-slate-200">

Correo electrónico

</label>


<input
type="email"
placeholder="ejemplo@gmail.com"
class="w-full px-4 py-2 border rounded-lg 
dark:bg-slate-700 dark:text-white">

</div>




<div>

<label class="block text-sm font-medium text-slate-700 dark:text-slate-200">

Mensaje

</label>


<textarea
rows="4"
placeholder="Escribe tu mensaje..."
class="w-full px-4 py-2 border rounded-lg 
dark:bg-slate-700 dark:text-white"></textarea>


</div>




<button
class="w-full bg-green-600 hover:bg-green-700 
text-white font-semibold py-3 rounded-lg">

Enviar mensaje

</button>


</form>




<a href="index.html"
class="block text-center mt-5 text-blue-600">

Volver al perfil

</a>



</div>


</body>

</html>
